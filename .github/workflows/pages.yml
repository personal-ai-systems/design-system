name: Publish concept previews
on:
  push:
    branches: [main]
    paths:
      - 'previews/**'
      - 'scripts/build-previews.mjs'
      - 'dist/web/**'
      - 'adapters/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node scripts/build-previews.mjs --output .pages-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
